  <line x1="274" y1="256" x2="300" y2="256" stroke="#6366F1" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="306" y="192" width="204" height="128" rx="14" fill="#131C31" stroke="#6366F1" stroke-width="1.5"/>
  <text x="326" y="224" fill="#818CF8" font-family="Inter, sans-serif" font-size="11" font-weight="700">STAGE 02</text>
  <text x="326" y="250" fill="#F9FAFB" font-family="Inter, sans-serif" font-size="16" font-weight="600">Priority Routing</text>
  <text x="326" y="274" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">SLA-based queue rank</text>
  <text x="326" y="298" fill="#60A5FA" font-family="Inter, sans-serif" font-size="12" font-weight="600">Re-ranked in 14ms</text>

