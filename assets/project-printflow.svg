  <text x="84" y="250" fill="#F9FAFB" font-family="Inter, sans-serif" font-size="16" font-weight="600">Ingestion &amp; Parse</text>
  <text x="84" y="274" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">PDF &amp; PostScript parser</text>
  <text x="84" y="298" fill="#10B981" font-family="Inter, sans-serif" font-size="12" font-weight="600">34 jobs ingested</text>

