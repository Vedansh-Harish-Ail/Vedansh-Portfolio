  <text x="810" y="224" fill="#6366F1" font-family="Inter, sans-serif" font-size="11" font-weight="700">STAGE 04</text>
  <text x="810" y="250" fill="#F9FAFB" font-family="Inter, sans-serif" font-size="16" font-weight="600">Auditing</text>
  <text x="810" y="274" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">Telemetry &amp; logs</text>
  <text x="810" y="298" fill="#10B981" font-family="Inter, sans-serif" font-size="12" font-weight="600">0 errors logged</text>

