  <rect x="64" y="344" width="896" height="236" rx="14" fill="#090D15" stroke="#1F2937" stroke-width="1"/>
  <text x="88" y="378" fill="#6B7280" font-family="monospace" font-size="12">[2026-11-06 14:22:01] INFO  agent.worker: Dispatched job #PF-8821 to Kyocera Taskalfa</text>
  <text x="88" y="408" fill="#6B7280" font-family="monospace" font-size="12">[2026-11-06 14:22:04] INFO  agent.preflight: Document PDF validated, 12 pages, duplex mode requested</text>
  <text x="88" y="438" fill="#10B981" font-family="monospace" font-size="12">[2026-11-06 14:22:05] SUCCESS agent.queue: Job completed in 3.4s, notification payload sent to webhooks</text>
  <text x="88" y="468" fill="#6B7280" font-family="monospace" font-size="12">[2026-11-06 14:22:08] INFO  agent.balancer: Auto-scaling worker pool from 2 -> 4 workers</text>
  <text x="88" y="498" fill="#60A5FA" font-family="monospace" font-size="12">[2026-11-06 14:22:11] HEALTH agent.heartbeat: All nodes responding, queue delay &lt; 20ms</text>
  <text x="88" y="528" fill="#6B7280" font-family="monospace" font-size="12">[2026-11-06 14:22:15] INFO  agent.scheduler: Next batch scheduled for execution</text>
