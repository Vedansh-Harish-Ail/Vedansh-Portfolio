  <line x1="516" y1="256" x2="542" y2="256" stroke="#6366F1" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="548" y="192" width="204" height="128" rx="14" fill="#131C31" stroke="#1F2937" stroke-width="1.5"/>
  <text x="568" y="224" fill="#6366F1" font-family="Inter, sans-serif" font-size="11" font-weight="700">STAGE 03</text>
  <text x="568" y="250" fill="#F9FAFB" font-family="Inter, sans-serif" font-size="16" font-weight="600">Hardware Dispatch</text>
  <text x="568" y="274" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">TCP socket streaming</text>
  <text x="568" y="298" fill="#10B981" font-family="Inter, sans-serif" font-size="12" font-weight="600">3 printers online</text>

