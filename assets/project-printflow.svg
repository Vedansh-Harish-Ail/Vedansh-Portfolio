  <text x="64" y="144" fill="#F9FAFB" font-family="Inter, sans-serif" font-size="20" font-weight="700">PrintFlow Agent: Workflow Automation</text>
  <text x="64" y="166" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="13">Automated spooling, format sanitization, queue load-balancing, and device dispatch</text>

